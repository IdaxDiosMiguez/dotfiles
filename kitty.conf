# --- Font Configuration --- #
font_family      family='JetBrainsMono Nerd Font Mono' style="Regular" features='+zero cv01=1 cv06=1 cv07=1 cv08=1 cv09=1 cv10=1 cv12=1 cv11=1'
bold_font        family='JetBrainsMono Nerd Font Mono' style="Bold" features='+zero cv01=1 cv06=1 cv07=1 cv08=1 cv09=1 cv10=1 cv12=1 cv11=1'
italic_font      auto
bold_italic_font auto

font_size 14.0
disable_ligatures never


# --- Cursor --- #
cursor_shape block


# --- Keybinds --- #
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard


# --- Visuals --- #
background_opacity 0.90
window_padding_width 10
box_drawing_scale 0.001, 1, 1.5, 2


# --- Theme --- #
include current-theme.conf


# --- Misc --- #
confirm_os_window_close 0
resize_debounce_time 0 0
placement_strategy top-left
shell_integration no-cursor
enable_audio_bell no

